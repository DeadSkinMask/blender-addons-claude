[package]
name = "rustremesher"
version = "0.1.0"
edition = "2021"
description = "Quad remesher engine (field-aligned integer-grid maps) for the RustRemesher Blender addon"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "rustremesher"
path = "src/lib.rs"

[[bin]]
name = "rustremesher"
path = "src/main.rs"

[dependencies]
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
